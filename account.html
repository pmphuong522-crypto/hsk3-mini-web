<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản HSK3 Mini Web</title><link rel="stylesheet" href="./practice/practice.css"><style>body{max-width:720px;margin:32px auto;padding:16px}.panel{padding:24px}.field{display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #ccd;border-radius:10px}#msg{margin:12px 0}</style></head><body><section class="panel"><h1>Tài khoản học viên / giáo viên</h1><p id="configMsg">Đang kiểm tra cấu hình...</p><label>Email<input class="field" id="email" type="email" autocomplete="email"></label><label>Mật khẩu<input class="field" id="password" type="password" autocomplete="current-password"></label><label>Họ tên (chỉ điền khi đăng ký)<input class="field" id="displayName" autocomplete="name"></label><div class="actions"><button class="btn primary" id="login">Đăng nhập</button><button class="btn" id="signup">Tạo tài khoản</button><button class="btn" id="logout">Đăng xuất</button></div><p id="msg"></p><a href="./practice.html">← Quay lại luyện tập</a> · <a href="./teacher.html">Teacher Dashboard</a></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const cfg=window.HSK_SUPABASE_CONFIG||{};const msg=document.getElementById('msg');let c=null;if(cfg.url&&cfg.anonKey&&window.supabase){c=window.supabase.createClient(cfg.url,cfg.anonKey);document.getElementById('configMsg').textContent='Đã có cấu hình Supabase.'}else document.getElementById('configMsg').innerHTML='Chưa cấu hình máy chủ. Hãy xem <b>SETUP_SUPABASE_V38.md</b>, tạo Supabase project và điền URL + anon key vào supabase-config.js. Chế độ luyện tập trên thiết bị vẫn hoạt động.';
const val=id=>document.getElementById(id).value.trim();document.getElementById('login').onclick=async()=>{if(!c)return msg.textContent='Chưa cấu hình Supabase.';let r=await c.auth.signInWithPassword({email:val('email'),password:val('password')});msg.textContent=r.error?.message||'Đăng nhập thành công. Có thể quay lại luyện tập.'};document.getElementById('signup').onclick=async()=>{if(!c)return msg.textContent='Chưa cấu hình Supabase.';let r=await c.auth.signUp({email:val('email'),password:val('password'),options:{data:{display_name:val('displayName')}}});msg.textContent=r.error?.message||(r.data.session?'Đăng ký thành công.':'Đã gửi đăng ký; nếu bật xác minh email, hãy kiểm tra hộp thư.')};document.getElementById('logout').onclick=async()=>{if(c)await c.auth.signOut();msg.textContent='Đã đăng xuất.'};
</script></body></html>
